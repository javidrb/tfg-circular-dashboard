# Configuración del despliegue del dashboard del TFG.

[theme]
base = "light"
primaryColor = "#1F77B4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F8"
textColor = "#1F2937"
font = "sans serif"

[server]
headless = true
runOnSave = false
# CORS lo gestiona Streamlit; mantener XSRF activado por defecto
enableXsrfProtection = true

[browser]
gatherUsageStats = false
