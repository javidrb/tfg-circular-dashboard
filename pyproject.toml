[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-circular-dashboard"
version = "0.1.0"
description = "Dashboard interactivo para la simulación de escenarios de economía circular sobre EE-IOT (TFG)"
authors = [{ name = "Javier de Ramón Boj" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["economia-circular", "input-output", "exiobase", "streamlit", "dashboard"]

[tool.setuptools.packages.find]
include = ["dashboard*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
